apiVersion: batch/v1
kind: Job
metadata:
  labels:
    experiment: marina-aug-dropout-alpha-sweep
    owner: atong
  name: atong-marina-aug-dropout-a02-s0
  namespace: guru-research
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                - NVIDIA-TITAN-RTX
                - NVIDIA-A40
                - NVIDIA-GeForce-RTX-3090
                - NVIDIA-RTX-A6000
                - NVIDIA-RTX-A5000
                - NVIDIA-A10
                - NVIDIA-GeForce-RTX-4090
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - gpu-13.nrp.mghpcc.org
                - gpu-02.nrp.mghpcc.org
                - hcc-chase-shor-c4705.unl.edu
                - hcc-chase-shor-c4709.unl.edu
                - hcc-chase-shor-c4715.unl.edu
                - ry-gpu-08.sdsc.optiputer.net
      containers:
      - args:
        - -c
        - set -euxo pipefail && bash /root/gurusmart/startup.sh MARINA1.zip && cd
          /code && pixi run torchrun --nproc_per_node 4 --module
          src.main marina --input_types {hsqc,c_nmr,h_nmr,mw,mass_spec} --seed 0 --aug_remove_prob
          0.5 --aug_alpha_remove 0.02 --experiment_name marina-aug-dropout-a02-s0
        command:
        - /bin/bash
        image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8.1
        imagePullPolicy: IfNotPresent
        name: demo
        resources:
          limits:
            cpu: '12'
            ephemeral-storage: 600Gi
            memory: 180Gi
            nvidia.com/gpu: '4'
          requests:
            cpu: '12'
            ephemeral-storage: 600Gi
            memory: 180Gi
            nvidia.com/gpu: '4'
        volumeMounts:
        - mountPath: /root/gurusmart
          name: atong-spectre
        - mountPath: /root/datasets
          name: smart-datasets
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /workspace
          name: data-unzip
        - mountPath: /code
          name: code-workdir
      restartPolicy: Never
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      terminationGracePeriodSeconds: 30
      volumes:
      - name: atong-spectre
        persistentVolumeClaim:
          claimName: atong-spectre
      - name: smart-datasets
        persistentVolumeClaim:
          claimName: smart-datasets
      - emptyDir:
          medium: Memory
        name: dshm
      - emptyDir: {}
        name: data-unzip
      - emptyDir: {}
        name: code-workdir
  ttlSecondsAfterFinished: 86400
---
