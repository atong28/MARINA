apiVersion: batch/v1
kind: Job
metadata:
  name: atong-marina2-build
  namespace: guru-research
  labels:
    owner: atong
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400  # 4 hours: merge + build.py + convert.py over 487K molecules
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - gpu-13.nrp.mghpcc.org
                      - hcc-chase-shor-c4705.unl.edu
                      - hcc-chase-shor-c4709.unl.edu
                      - hcc-chase-shor-c4715.unl.edu
      containers:
        - name: build
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8.1
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              set -euxo pipefail

              echo "=== Step 1: Merge train shards ==="
              cat /root/gurusmart/marina2/predictions/train_shard*.jsonl \
                > /root/gurusmart/marina2/predictions/train.jsonl
              wc -l /root/gurusmart/marina2/predictions/train.jsonl
              echo "Train shards merged"

              echo "=== Step 2: Build MARINA2 JSONL ==="
              cd /root/gurusmart/marina2/NMRNet
              pixi run python3 marina2/build.py \
                --marina1    /root/gurusmart/marina2/MARINA1 \
                --preds-dir  /root/gurusmart/marina2/predictions \
                --output     /root/gurusmart/marina2/MARINA2

              echo "=== Step 3: Convert JSONL to Arrow ==="
              bash /root/gurusmart/startup.sh MARINA1.zip
              # startup.sh clones SMART-Moonshot; clone MARINA separately for convert.py
              GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
                git clone --depth 1 git@github.com:atong28/MARINA.git /tmp/marina-scripts
              cd /code
              pixi run python /tmp/marina-scripts/scripts/dataset/convert.py \
                --to-arrow /root/gurusmart/marina2/MARINA2 /root/gurusmart/marina2/MARINA2_arrow
              rm -rf /root/gurusmart/marina2/MARINA2
              mv /root/gurusmart/marina2/MARINA2_arrow /root/gurusmart/marina2/MARINA2

              echo "=== Build complete ==="
              echo "MARINA2 is at /root/gurusmart/marina2/MARINA2"
          volumeMounts:
            - mountPath: /root/gurusmart
              name: atong-spectre
            - mountPath: /root/datasets
              name: smart-datasets
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /workspace
              name: data-unzip
            - mountPath: /code
              name: code-workdir
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 50Gi
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 50Gi
      volumes:
        - name: atong-spectre
          persistentVolumeClaim:
            claimName: atong-spectre
        - name: smart-datasets
          persistentVolumeClaim:
            claimName: smart-datasets
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
        - name: data-unzip
          emptyDir: {}
        - name: code-workdir
          emptyDir: {}
