# Second wave of the dataset comparison. Both need exp/marina234.
#
#   marina-m1-m3-ft-s0   MARINA1 pretrain -> MARINA3 finetune. Warm-starts from the
#                        marina-final-run-seed-2 checkpoint (the distill sweep's
#                        teacher) rather than retraining MARINA1, saving ~5 days.
#                        lr 5e-5 follows the distill sweep precedent for finetuning.
#                        --modality_drop_override 0.0 disables modality dropping,
#                        which MARINA3 wants anyway: 70.3% of its molecules carry a
#                        single modality that always_keep already protects.
#
#   marina-drop0668-s0   MARINA1 at the drop probability that actually yields 50%
#                        modality presence. compute_drop_percentage ignores the
#                        always_keep exemption, so the stock 0.500 really trains at
#                        62.6% presence; 0.668 is the corrected value. Isolates what
#                        the presence rate is worth, independent of any dataset change.
#
# Still queued: MARINA4 -> MARINA3 finetune, which needs marina-m4-s0 to finish first.
apiVersion: batch/v1
kind: Job
metadata:
  name: atong-marina-m1-m3-ft-s0
  labels:
    owner: atong
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                    - NVIDIA-TITAN-RTX
                    - NVIDIA-A40
                    - NVIDIA-GeForce-RTX-3090
                    - NVIDIA-RTX-A6000
                    - NVIDIA-RTX-A5000
                    - NVIDIA-A10
                    - NVIDIA-GeForce-RTX-4090
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - gpu-13.nrp.mghpcc.org
                    - hcc-chase-shor-c4705.unl.edu
                    - hcc-chase-shor-c4709.unl.edu
                    - hcc-chase-shor-c4715.unl.edu
                    - ry-gpu-08.sdsc.optiputer.net
      containers:
        - name: demo
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8.1
          env:
            - name: DATASETS
              value: "MARINA3.zip"
            - name: BRANCH
              value: "main"
          command: ["/bin/bash"]
          args:
            - "-c"
            - >-
              set -euxo pipefail &&
              bash /root/gurusmart/startup.sh &&
              cd /code &&
              git fetch origin &&
              git checkout exp/marina234 &&
              pixi run torchrun --nproc_per_node 4 --module src.main marina --input_types {hsqc,c_nmr,h_nmr,mw,mass_spec} --seed 0 --lr 5e-5 --modality_drop_override 0.0 --load_from_checkpoint /root/gurusmart/Moonshot/results/marina-final-run-seed-2/2026-05-07_23-58-54/epoch_epoch=689.ckpt --experiment_name marina-m1-m3-ft-s0
          volumeMounts:
            - mountPath: "/root/gurusmart"
              name: atong-spectre
            - mountPath: "/root/datasets"
              name: smart-datasets
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /workspace
              name: data-unzip
            - mountPath: /code
              name: code-workdir
          resources:
            limits:
              memory: 180Gi
              cpu: "8"
              ephemeral-storage: 600Gi
              nvidia.com/gpu: "4"
            requests:
              memory: 180Gi
              cpu: "8"
              ephemeral-storage: 600Gi
              nvidia.com/gpu: "4"
      volumes:
        - name: atong-spectre
          persistentVolumeClaim:
            claimName: atong-spectre
        - name: smart-datasets
          persistentVolumeClaim:
            claimName: smart-datasets
        - name: dshm
          emptyDir:
            medium: Memory
        - name: data-unzip
          emptyDir: {}
        - name: code-workdir
          emptyDir: {}
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
  backoffLimit: 0
---
