# Dataset comparison: does experimental data help, and does fixing the per-atom/
# per-peak convention mismatch help?
#
#   marina-m2-s0   MARINA2 (MARINA1 + experimental spectra substituted) from scratch
#   marina-m4-s0   MARINA4 (MARINA1 with 13C/1H collapsed to per-peak) from scratch
#
# Both run stock `main` with default args, identical to the MARINA1 final run except
# for the dataset zip, so any benchmark delta is attributable to the data alone.
# marina-m4-s0 doubles as the pretrained checkpoint for the MARINA4 -> MARINA3
# finetuning arm.
#
# The two finetuning arms and the 0.668-dropout test are NOT here: they need
# exp/marina234 (modality_drop_override, finetune arg protection, warm-start on
# train) to be pushed first.
apiVersion: batch/v1
kind: Job
metadata:
  name: atong-marina-m2-s0
  labels:
    owner: atong
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                    - NVIDIA-TITAN-RTX
                    - NVIDIA-A40
                    - NVIDIA-GeForce-RTX-3090
                    - NVIDIA-RTX-A6000
                    - NVIDIA-RTX-A5000
                    - NVIDIA-A10
                    - NVIDIA-GeForce-RTX-4090
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - gpu-13.nrp.mghpcc.org
                    - hcc-chase-shor-c4705.unl.edu
                    - hcc-chase-shor-c4709.unl.edu
                    - hcc-chase-shor-c4715.unl.edu
                    - ry-gpu-08.sdsc.optiputer.net
      containers:
        - name: demo
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8.1
          command: ["/bin/bash"]
          args:
            - "-c"
            - >-
              set -euxo pipefail &&
              bash /root/gurusmart/startup.sh MARINA2.zip &&
              cd /code &&
              pixi run torchrun --nproc_per_node 4 --module src.main marina --input_types {hsqc,c_nmr,h_nmr,mw,mass_spec} --seed 0 --experiment_name marina-m2-s0
          volumeMounts:
            - mountPath: "/root/gurusmart"
              name: atong-spectre
            - mountPath: "/root/datasets"
              name: smart-datasets
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /workspace
              name: data-unzip
            - mountPath: /code
              name: code-workdir
          resources:
            limits:
              memory: 180Gi
              cpu: "8"
              ephemeral-storage: 600Gi
              nvidia.com/gpu: "4"
            requests:
              memory: 180Gi
              cpu: "8"
              ephemeral-storage: 600Gi
              nvidia.com/gpu: "4"
      volumes:
        - name: atong-spectre
          persistentVolumeClaim:
            claimName: atong-spectre
        - name: smart-datasets
          persistentVolumeClaim:
            claimName: smart-datasets
        - name: dshm
          emptyDir:
            medium: Memory
        - name: data-unzip
          emptyDir: {}
        - name: code-workdir
          emptyDir: {}
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
  backoffLimit: 0
---
