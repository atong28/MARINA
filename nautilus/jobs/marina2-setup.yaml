apiVersion: batch/v1
kind: Job
metadata:
  name: atong-marina2-setup
  namespace: guru-research
  labels:
    owner: atong
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 10800  # 3 hours: startup.sh + convert + clone + pixi install + weight download
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - gpu-13.nrp.mghpcc.org
                      - hcc-chase-shor-c4705.unl.edu
                      - hcc-chase-shor-c4709.unl.edu
                      - hcc-chase-shor-c4715.unl.edu
      containers:
        - name: setup
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8.1
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              set -euxo pipefail

              echo "=== SSH key setup ==="
              mkdir -p ~/.ssh
              cp /root/gurusmart/.ssh/id_rsa ~/.ssh/id_rsa
              cp /root/gurusmart/.ssh/id_rsa.pub ~/.ssh/id_rsa.pub

              echo "=== Step 1: MARINA1 Arrow → JSONL ==="
              if [ ! -f /root/gurusmart/marina2/MARINA1/train.jsonl ]; then
                bash /root/gurusmart/startup.sh MARINA1.zip
                GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
                  git clone --depth 1 git@github.com:atong28/MARINA.git /tmp/marina-scripts
                if [ -f /workspace/index.pkl ]; then
                  MARINA1_SRC=/workspace
                elif [ -f /workspace/MARINA1/index.pkl ]; then
                  MARINA1_SRC=/workspace/MARINA1
                else
                  echo "ERROR: cannot locate index.pkl after extraction" && exit 1
                fi
                mkdir -p /root/gurusmart/marina2/MARINA1
                cd /code
                pixi run python /tmp/marina-scripts/scripts/dataset/convert.py --from-arrow ${MARINA1_SRC} /root/gurusmart/marina2/MARINA1
                echo "Conversion done"
              else
                echo "MARINA1 JSONL already present, skipping"
              fi

              echo "=== Step 2: Clone NMRNet + pixi install ==="
              if [ ! -d /root/gurusmart/marina2/NMRNet/.pixi ]; then
                rm -rf /root/gurusmart/marina2/NMRNet
                GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" \
                  git clone --depth 1 git@github.com:atong28/NMRNet /root/gurusmart/marina2/NMRNet
                cd /root/gurusmart/marina2/NMRNet
                PIXI_NO_PROGRESS=true pixi install
                echo "NMRNet env installed"
              else
                echo "NMRNet pixi env already present, skipping"
              fi

              echo "=== Step 3: Download weights ==="
              cd /root/gurusmart/marina2/NMRNet
              pixi run python3 scripts/download_weights.py --output-dir /root/gurusmart/marina2/weights

              mkdir -p /root/gurusmart/marina2/predictions
              echo "=== Setup complete ==="
          volumeMounts:
            - mountPath: /root/gurusmart
              name: atong-spectre
            - mountPath: /root/datasets
              name: smart-datasets
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /workspace
              name: data-unzip
            - mountPath: /code
              name: code-workdir
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 50Gi
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 50Gi
      volumes:
        - name: atong-spectre
          persistentVolumeClaim:
            claimName: atong-spectre
        - name: smart-datasets
          persistentVolumeClaim:
            claimName: smart-datasets
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
        - name: data-unzip
          emptyDir: {}
        - name: code-workdir
          emptyDir: {}
