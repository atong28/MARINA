apiVersion: batch/v1
kind: Job
metadata:
  name: atong-marina-m2-s1
  labels:
    owner: atong
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                    - NVIDIA-TITAN-RTX
                    - NVIDIA-A40
                    - NVIDIA-GeForce-RTX-3090
                    - NVIDIA-RTX-A6000
                    - NVIDIA-RTX-A5000
                    - NVIDIA-A10
                    - NVIDIA-GeForce-RTX-4090
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - gpu-13.nrp.mghpcc.org
                    - hcc-chase-shor-c4705.unl.edu
                    - hcc-chase-shor-c4709.unl.edu
                    - hcc-chase-shor-c4715.unl.edu
                    - ry-gpu-08.sdsc.optiputer.net
      containers:
        - name: demo
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8.1
          env:
            - name: DATASETS
              value: "MARINA2.zip"
            - name: BRANCH
              value: "main"
          command: ["/bin/bash"]
          args:
            - "-c"
            - >-
              set -euxo pipefail &&
              bash /root/gurusmart/startup.sh &&
              cd /code &&
              pixi run torchrun --nproc_per_node 4 --module src.main marina --input_types {hsqc,c_nmr,h_nmr,mw,mass_spec} --seed 1 --experiment_name marina-m2-s1
          volumeMounts:
            - mountPath: "/root/gurusmart"
              name: atong-spectre
            - mountPath: "/root/datasets"
              name: smart-datasets
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /workspace
              name: data-unzip
            - mountPath: /code
              name: code-workdir
          resources:
            limits:
              memory: 180Gi
              cpu: "8"
              ephemeral-storage: 600Gi
              nvidia.com/gpu: "4"
            requests:
              memory: 180Gi
              cpu: "8"
              ephemeral-storage: 600Gi
              nvidia.com/gpu: "4"
      volumes:
        - name: atong-spectre
          persistentVolumeClaim:
            claimName: atong-spectre
        - name: smart-datasets
          persistentVolumeClaim:
            claimName: smart-datasets
        - name: dshm
          emptyDir:
            medium: Memory
        - name: data-unzip
          emptyDir: {}
        - name: code-workdir
          emptyDir: {}
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
  backoffLimit: 0
---
