apiVersion: batch/v1
kind: Job
metadata:
  name: atong-marina2-predict
  namespace: guru-research
  labels:
    owner: atong
spec:
  completionMode: Indexed
  completions: 10     # indices 0-7: train shards, 8: val, 9: test
  parallelism: 10
  backoffLimit: 20    # 2 retries per index
  activeDeadlineSeconds: 86400  # 24 hours
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-TITAN-RTX
                      - NVIDIA-A40
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-A6000
                      - NVIDIA-RTX-A5000
                      - NVIDIA-A10
                      - NVIDIA-GeForce-RTX-4090
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - gpu-13.nrp.mghpcc.org
                      - hcc-chase-shor-c4705.unl.edu
                      - hcc-chase-shor-c4709.unl.edu
                      - hcc-chase-shor-c4715.unl.edu
      containers:
        - name: predict
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8.1
          command: ["/bin/bash"]
          args:
            - "-c"
            - |
              set -euxo pipefail

              IDX=${JOB_COMPLETION_INDEX}
              if [ "$IDX" -le 7 ]; then
                SPLIT=train
                OUT=/root/gurusmart/marina2/predictions/train_shard${IDX}.jsonl
                EXTRA="--shard ${IDX} 8"
              elif [ "$IDX" -eq 8 ]; then
                SPLIT=val
                OUT=/root/gurusmart/marina2/predictions/val.jsonl
                EXTRA=""
              else
                SPLIT=test
                OUT=/root/gurusmart/marina2/predictions/test.jsonl
                EXTRA=""
              fi

              echo "Index ${IDX}: split=${SPLIT} output=${OUT}"
              cd /root/gurusmart/marina2/NMRNet
              PYTHONPATH=/root/gurusmart/marina2/NMRNet pixi run python3 marina2/predict.py \
                --input  /root/gurusmart/marina2/MARINA1/${SPLIT}.jsonl \
                --output ${OUT} \
                --weights /root/gurusmart/marina2/weights \
                --device cuda \
                ${EXTRA}
          volumeMounts:
            - mountPath: /root/gurusmart
              name: atong-spectre
            - mountPath: /dev/shm
              name: dshm
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: "1"
      volumes:
        - name: atong-spectre
          persistentVolumeClaim:
            claimName: atong-spectre
        - name: dshm
          emptyDir:
            medium: Memory
