apiVersion: batch/v1
kind: Job
metadata:
  name: atong-substructure-t2eval-20260911
  labels: { owner: atong }
spec:
  backoffLimit: 8
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsUser: 0, runAsGroup: 0, fsGroup: 0 }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values: [NVIDIA-A40, NVIDIA-RTX-A6000, NVIDIA-RTX-A5000, NVIDIA-A10,
                             NVIDIA-GeForce-RTX-3090, NVIDIA-GeForce-RTX-4090,
                             NVIDIA-TITAN-RTX, NVIDIA-L40, NVIDIA-L40S]
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [ry-gpu-03.sdsc.optiputer.net, hcc-nrp-shor-c5909.unl.edu, hcc-chase-shor-c4705.unl.edu]
      containers:
        - name: t2eval
          image: gitlab-registry.nrp-nautilus.io/a8tong/smart-moonshot/pixi-cuda:12.8
          command: ["/bin/bash", "-c"]
          args:
            # Shape-T2 substructure eval: plain journal (no --sim, no --deltas). fp_loader fast
            # path needs only DATASET_ROOT/RankingEntropySubstructure/{bitinfo_to_idx.pkl,
            # rankingset.pt} (pre-staged on the PVC). Fills Table 2 substructure row (val
            # nmr_mw_formula rank@1/5/10 + cos). Clone+pixi bootstrap; no /workspace dataset.
            - >-
              set -euo pipefail &&
              export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" &&
              mkdir -p ~/.ssh &&
              cp /root/gurusmart/.ssh/id_rsa ~/.ssh/id_rsa &&
              cp /root/gurusmart/.ssh/id_rsa.pub ~/.ssh/id_rsa.pub &&
              chmod 600 ~/.ssh/id_rsa &&
              git clone --branch main git@github.com:atong28/MARINA.git /code &&
              echo "[job] code @ $(git -C /code rev-parse --short HEAD)" &&
              pixi install --manifest-path /code/pixi.toml &&
              cd /code &&
              DATASET_ROOT=/root/gurusmart/subst-dataset BENCHMARK_ROOT=/root/gurusmart/Benchmark PYTHONPATH=/code
              pixi run python scripts/benchmark/eval_journal_benchmark.py
              --results_root /root/gurusmart/Moonshot/results
              --experiments marina-deltaai-substructure-s0 marina-deltaai-substructure-s1 marina-deltaai-substructure-s2
          resources:
            requests: { cpu: "6", memory: 40Gi, ephemeral-storage: 40Gi, nvidia.com/gpu: "1" }
            limits:   { cpu: "8", memory: 48Gi, ephemeral-storage: 50Gi, nvidia.com/gpu: "1" }
          volumeMounts:
            - { name: atong-spectre,  mountPath: /root/gurusmart }
            - { name: smart-datasets, mountPath: /root/datasets }
            - { name: dshm,           mountPath: /dev/shm }
            - { name: code-workdir,   mountPath: /code }
      volumes:
        - { name: atong-spectre,  persistentVolumeClaim: { claimName: atong-spectre } }
        - { name: smart-datasets, persistentVolumeClaim: { claimName: smart-datasets } }
        - { name: dshm,           emptyDir: { medium: Memory } }
        - { name: code-workdir,   emptyDir: {} }
