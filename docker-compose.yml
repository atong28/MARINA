services:

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  # The ONLY container with a host-exposed port.
  # All browser traffic enters here and is forwarded to the frontend.
  # API exposure can be toggled at this layer via EXPOSE_API_VIA_NGINX.
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: marina-nginx:latest
    container_name: marina-nginx
    ports:
      # Set NGINX_PORT in .env to change the host port.
      - "${NGINX_PORT:-8643}:80"
    depends_on:
      - frontend
      - backend
    environment:
      EXPOSE_API_VIA_NGINX: ${EXPOSE_API_VIA_NGINX:-false}
    networks:
      - proxy-net
      - backend-net
    restart: unless-stopped


  # ── Frontend ──────────────────────────────────────────────────────────────────
  # No host port – only reachable through the nginx proxy.
  # Its own nginx can proxy /api/* to backend for internal requests.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time.
        # /api is the default – the frontend's nginx proxies it to the backend service.
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        # Keep in step with EXPOSE_API_VIA_NGINX on the nginx service.
        VITE_SHOW_API_DOCS: ${EXPOSE_API_VIA_NGINX:-false}
    image: marina-frontend:latest
    container_name: marina-frontend
    depends_on:
      backend:
        condition: service_started
    networks:
      - proxy-net    # reachable by the nginx proxy
      - backend-net  # can reach the backend
    restart: unless-stopped


  # ── Backend ───────────────────────────────────────────────────────────────────
  # No host port. Reachable on backend-net only: the edge nginx proxies /api/*
  # to it, and the frontend's own nginx can too.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Repo root, from which the Dockerfile copies src/ (and nothing else).
      additional_contexts:
        marina: .
      # Default index builds CPU-only wheels.
      # CUDA 12.4: TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
      # CUDA 12.8: TORCH_INDEX_URL=https://download.pytorch.org/whl/cu128
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        # true / 1 / yes → NumPy 1.26 + pandas 2.x wheels (older CPU baseline, no x86-64-v2).
        # Set LEGACY_NUMPY=true in root .env for hosts that error on NumPy CPU baseline.
        LEGACY_NUMPY: ${LEGACY_NUMPY:-false}
    image: marina-backend:latest
    container_name: marina-backend
    # Resident size is ~3 GB per model copy, and there are
    # UVICORN_WORKERS * (1 + MAX_COMPUTE_WORKERS) copies (3 by default, ~9.5 GB).
    # Raise this with the worker counts.
    mem_limit: ${BACKEND_MEM_LIMIT:-16g}
    environment:
      # ── Inference device ────────────────────────────────────────────────────
      # "cpu" | "cuda" | "cuda:0"
      DEVICE: ${DEVICE:-cpu}

      # ── Server ──────────────────────────────────────────────────────────────
      BACKEND_PORT: "5000"
      # Total model copies in RAM = UVICORN_WORKERS * (1 + MAX_COMPUTE_WORKERS).
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}

      # ── Model paths ─────────────────────────────────────────────────────────
      # src/ is baked into the image at /marina/src (see backend/Dockerfile).
      MARINA_ROOT: /marina
      # The model data directory is mounted at /data.
      DATA_DIR: /data
      MODEL_ROOT: /data/marina_db_s1
      DEFAULT_MODEL_ID: marina_db_s1
      MODELS_JSON_PATH: /data/models.json

      # ── Compute pool ─────────────────────────────────────────────────────────
      MAX_COMPUTE_WORKERS: ${MAX_COMPUTE_WORKERS:-2}
      MAX_COMPUTE_QUEUE: ${MAX_COMPUTE_QUEUE:-8}

      # ── Misc ─────────────────────────────────────────────────────────────────
      PRELOAD_MODELS: ${PRELOAD_MODELS:-default}
      DATASET_ROOT: /data
      # false → plain depictions only, and the UI hides its similarity-map toggle.
      HIGHLIGHT_ENABLED: ${HIGHLIGHT_ENABLED:-true}
      # attribution (default) or ablation — see backend/README.md.
      HIGHLIGHT_METHOD: ${HIGHLIGHT_METHOD:-attribution}

      # ── Usage stats ─────────────────────────────────────────────────────────
      # Persisted on a writable named volume; /data is mounted read-only.
      STATS_PATH: ${STATS_PATH:-/var/lib/marina/stats.json}
      KMP_DUPLICATE_LIB_OK: "TRUE"
      PYTHONUNBUFFERED: "1"

    volumes:
      # Model data directory (read-only) – contains models.json + per-model dirs
      - ${MODEL_DATA_DIR:-./checkpoints}:/data:ro
      # Writable state (usage counters). Survives container replacement.
      - marina-state:/var/lib/marina

    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    # Uncomment to enable GPU access (requires NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]


volumes:
  marina-state:


networks:
  # nginx proxy ↔ frontend
  proxy-net:
    driver: bridge
  # frontend ↔ backend (backend is invisible to the proxy)
  backend-net:
    driver: bridge
