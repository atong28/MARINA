[workspace]
authors = ["Anthony Tong <atong28.usa@gmail.com>"]
channels = ["https://prefix.dev/conda-forge"]
name = "MARINA-Backend"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = ">=3.13,<3.14"
numpy = ">=2.4.2,<3"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
wandb = ">=0.25.0,<0.26"
rdkit = ">=2025.9.6,<2026"
ipython = ">=9.10.0,<10"
ipykernel = ">=7.2.0,<8"
jupyter = ">=1.1.1,<2"
tqdm = ">=4.67.3,<5"
tyro = ">=1.0.8,<2"
gdown = ">=5.2.1,<6"
openpyxl = ">=3.1.5,<4"
pyarrow = ">=23.0.1,<24"
pillow = ">=12.2.0,<13"
requests = ">=2.33.1,<3"
python-multipart = ">=0.0.24,<0.0.25"
fastapi = ">=0.135.3,<0.136"
uvicorn = ">=0.44.0,<0.45"
pytest = ">=9.1.1,<10"
pytest-asyncio = ">=1.4.0,<2"
httpx = ">=0.28.1,<0.29"

[pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128" }
lightning = { version = "==2.6.1" }
torch_geometric = { version = "==2.7.0"}
