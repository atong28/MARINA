[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    slow: spawns worker processes or builds models; excluded by `-m "not slow"`
asyncio_mode = auto
filterwarnings =
    ignore:Sparse CSR tensor support is in beta state:UserWarning
    ignore:The PyTorch API of nested tensors:UserWarning
    ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning
