# Policy for the bit-panel fragment-drawing worker only (a dedicated worker takes
# its CSP from its own response, not the page's). RDKit.js's Emscripten bindings
# compile functions with new Function(), so eval is allowed here and nowhere
# else; the worker has no DOM and draws only model-vocabulary fragments.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
