# Restores the real client IP when nginx sits behind cloudflared.
#
# Mounted to /etc/nginx/conf.d/00-realip.conf by docker-compose.cloudflared.yml.
# Included in the http context, so it applies before the marina-proxy server block
# rewrites X-Forwarded-For to $remote_addr.
#
# Without this, $remote_addr is the cloudflared container's IP for every request,
# so the backend's per-client rate limiter and unique-visitor counter see all
# traffic as one client.
#
# 0.0.0.0/0 is safe ONLY because tunnel mode publishes no host port: the sole
# route to this nginx is the proxy-net bridge from cloudflared. Do not mount this
# file on a deployment that also exposes a port to the host or LAN — anyone who
# can reach nginx directly could then spoof CF-Connecting-IP.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header CF-Connecting-IP;
