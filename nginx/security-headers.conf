# Response headers for every page and API response the edge serves. Included at
# server level by both proxy configs. nginx drops server-level add_header in any
# location that sets its own, so locations here must not use add_header (the
# API-docs locations include security-headers-docs.conf instead).
server_tokens off;

# The SPA loads only its own scripts, styles and API. Inline styles are needed by
# Handsontable; 'wasm-unsafe-eval' lets RDKit.js compile its WebAssembly (the
# bit-panel fragment thumbnails). Depictions arrive as data: images.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
