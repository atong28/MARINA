# Edge rate limit, a coarse second layer under the backend's per-endpoint
# budgets: generous enough that no person clicking through results reaches it,
# it only caps floods. Keyed on the client address ($remote_addr is the real
# visitor behind Cloudflare, via realip-cloudflare.conf).
limit_req_zone $binary_remote_addr zone=marina_api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    include /etc/nginx/marina/security-headers.conf;

    # API visibility toggle is ON: route /api directly to the backend service.
    location = /api {
        proxy_pass         http://backend:5000/api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite rather than append: $proxy_add_x_forwarded_for would
        # prepend any client-supplied value, letting callers forge the
        # address the backend rate-limits on.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
    }

    location ^~ /api/ {
        limit_req          zone=marina_api burst=40 nodelay;
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite rather than append: $proxy_add_x_forwarded_for would
        # prepend any client-supplied value, letting callers forge the
        # address the backend rate-limits on.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
    }

    # Explicitly expose FastAPI documentation pages at the edge.
    location = /docs {
        include /etc/nginx/marina/security-headers-docs.conf;
        proxy_pass         http://backend:5000/docs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite rather than append: $proxy_add_x_forwarded_for would
        # prepend any client-supplied value, letting callers forge the
        # address the backend rate-limits on.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /docs/oauth2-redirect {
        include /etc/nginx/marina/security-headers-docs.conf;
        proxy_pass         http://backend:5000/docs/oauth2-redirect;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite rather than append: $proxy_add_x_forwarded_for would
        # prepend any client-supplied value, letting callers forge the
        # address the backend rate-limits on.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /redoc {
        include /etc/nginx/marina/security-headers-docs.conf;
        proxy_pass         http://backend:5000/redoc;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite rather than append: $proxy_add_x_forwarded_for would
        # prepend any client-supplied value, letting callers forge the
        # address the backend rate-limits on.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        include /etc/nginx/marina/security-headers-docs.conf;
        proxy_pass         http://backend:5000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite rather than append: $proxy_add_x_forwarded_for would
        # prepend any client-supplied value, letting callers forge the
        # address the backend rate-limits on.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # The fragment-drawing worker gets its own, eval-permitting policy; see
    # security-headers-worker.conf. Regex locations beat the "/" prefix below.
    location ~ ^/assets/fragmentWorker-[A-Za-z0-9_-]+\.js$ {
        include /etc/nginx/marina/security-headers-worker.conf;
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # Forward all non-API traffic to the frontend container.
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Overwrite rather than append: $proxy_add_x_forwarded_for would
        # prepend any client-supplied value, letting callers forge the
        # address the backend rate-limits on.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support WebSocket upgrades (used by Vite HMR in dev; harmless in prod)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;

        # Allow long-running API calls (predictions) to complete
        proxy_read_timeout    300s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
    }
}
