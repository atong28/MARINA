server {
    listen 80;
    server_name _;

    # Forward all traffic to the frontend container.
    # The frontend's own nginx handles /api/* proxying to the backend.
    # The backend is not reachable from this proxy – it lives on a separate
    # internal network shared only with the frontend.
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support WebSocket upgrades (used by Vite HMR in dev; harmless in prod)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $http_connection;

        # Allow long-running API calls (predictions) to complete
        proxy_read_timeout    300s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
    }
}
