server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Proxy all /api requests to the backend service.
    # The backend service is named "backend" in the Docker network.
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow long-running predictions to complete
        proxy_read_timeout    300s;
        proxy_connect_timeout  30s;
        proxy_send_timeout    300s;
    }

    # Long-lived cache for versioned assets (Vite hashes filenames)
    location ~* \.(?:js|css|wasm|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must always be revalidated: it is the only thing pointing at
    # the hashed asset names, and without this browsers keep it by heuristic
    # (10% of its age) and run a stale bundle against a redeployed backend.
    # The try_files fallback below re-enters location matching, so this covers
    # every SPA route as well as "/".
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA catch-all: serve index.html for any unmatched path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
