[project]
name = "domain-compare"
version = "0.1.0"
description = "Isolated analysis: molecular domain of public spectroscopic datasets (Alberts/MMSD, NMRexp, nmrshiftdb2-2024, MassSpecGym) vs MARINA1. Independent of MARINA code."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
rdkit = "*"
numpy = "*"
scipy = "*"
pandas = "*"
pyarrow = "*"
scikit-learn = "*"
umap-learn = "*"
matplotlib = "*"

[pypi-dependencies]
mhfp = "*"
