[project]
name = "peak-sim-analysis"
version = "0.1.0"
description = "Isolated analysis: peak-aware 13C similarity across MARINA benchmark spectral sources (Annotated/Journal/Sim). Independent of MARINA code."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pytorch = { version = "*", channel = "conda-forge" }  # CPU build; only needed to unpickle benchmark tensors
