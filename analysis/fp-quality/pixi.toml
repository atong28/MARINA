[workspace]
name = "fp-quality"
version = "0.1.0"
description = "Intrinsic quality of the MARINA fingerprints. Exp2 = mass-stratified specificity (Count-your-bits Fig 2); Exp1 = MCES similarity-structure agreement (RascalMCES reference). Canonical run env is the ~/Workspace master pixi env (torch+rdkit+scipy together); this dir env is a torch-free fallback for the cheap analysis step (exp1_analyze) only."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pandas = "*"
pyarrow = "*"
matplotlib = "*"
rdkit = ">=2023.09"
