[workspace]
name = "fp-redundancy"
version = "0.1.0"
description = "Isolated analysis: mutual-information redundancy of the 16384-bit RankingEntropy (sherlock) fingerprint on MARINA1, and whether de-correlating the retrieval metric improves ranking. Torch-free; consumes exports produced with MARINA's own env."
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
numpy = "*"
scipy = "*"
pandas = "*"
pyarrow = "*"
matplotlib = "*"
